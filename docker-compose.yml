
services:
  # 1. Redis Session Memory Store
  redis:
    image: redis:alpine
    container_name: tamiledu-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in your .env file -- see .env.example}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 2. FastAPI Generation Service
  generation-service:
    build:
      context: ./backend/generation-service
      dockerfile: Dockerfile
    container_name: tamiledu-generation
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_URL=${NVIDIA_API_URL:-https://integrate.api.nvidia.com/v1/images/generations}
      - NVIDIA_IMAGE_MODEL=${NVIDIA_IMAGE_MODEL:-alibaba/qwen-image}
      - GENERATION_ADMIN_KEY=${GENERATION_ADMIN_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}
      - GLOSSARY_PATH=/app/glossary_all_classes.csv
    volumes:
      # The glossary CSV lives at the repo root, outside this service's build
      # context -- mount it in explicitly rather than relying on a path that
      # only exists on one developer's machine (see image/prompt_enhancer.py).
      - ./glossary_all_classes.csv:/app/glossary_all_classes.csv:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Retrieval Service
  retrieval-service:
    build:
      context: ./backend/retrieval-service
      dockerfile: Dockerfile
    container_name: tamiledu-retrieval
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - CORRECTION_SERVICE_HOST=correction-service
      - CORRECTION_SERVICE_PORT=8002
      - RETRIEVAL_ADMIN_KEY=${RETRIEVAL_ADMIN_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - correction-service
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3b. Celery Worker for Retrieval Service
  retrieval-worker:
    build:
      context: ./backend/retrieval-service
      dockerfile: Dockerfile
    container_name: tamiledu-retrieval-worker
    command: celery -A app.ingestion.tasks worker --loglevel=info --concurrency=1
    volumes:
      - ./data:/data
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/2
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: always

  # 4. FastAPI Correction Service
  correction-service:
    build:
      context: ./backend/correction-service
      dockerfile: Dockerfile
    container_name: tamiledu-correction
    ports:
      - "8002:8002"
    environment:
      - CORRECTION_ADMIN_KEY=${CORRECTION_ADMIN_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5000}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Node API Gateway
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: tamiledu-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RETRIEVAL_SERVICE_HOST=retrieval-service
      - RETRIEVAL_SERVICE_PORT=8000
      - GENERATION_SERVICE_HOST=generation-service
      - GENERATION_SERVICE_PORT=8001
      - GENERATION_ADMIN_KEY=${GENERATION_ADMIN_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./data:/data
    depends_on:
      redis:
        condition: service_started
      retrieval-service:
        condition: service_healthy
      generation-service:
        condition: service_healthy
    restart: always

  # 6. React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the static bundle at build time -- points the browser at the
        # gateway's *published* address, not its in-network container name (the
        # browser runs on the host/client, not inside the docker-compose network).
        REACT_APP_GATEWAY_URL: ${REACT_APP_GATEWAY_URL:-http://localhost:5000}
    container_name: tamiledu-frontend
    ports:
      - "3000:3000"
    depends_on:
      retrieval-service:
        condition: service_healthy
      generation-service:
        condition: service_healthy
      correction-service:
        condition: service_healthy
      gateway:
        condition: service_started
    restart: always

volumes:
  redis_data:
